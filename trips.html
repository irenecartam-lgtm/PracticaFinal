<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Trips | TripPlan+</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script src="trips.js" defer></script>

</head>

<body class="trips-body">

  <header>

    <h1>TripPlan+</h1>

    <nav class="nav">

      <ul>

        <li><a href="index.html#home">Home</a></li>

        <li><a href="index.html#popular">Most Popular</a></li>

        <li><a href="trips.html">Plan a trip IA</a></li>

        <li><a href="index.html#weather">Weather</a></li>

        <li><a href="index.html#about-us">About us</a></li>

      </ul>

    </nav>

    <nav id="nav-login" class="nav">
      <a href="index.html#contact"><button class="contact">Contact Us</button></a>
    </nav>

  </header>

  <main class="trips-page">

    <section class="planner-section">

      <div class="planner-form-container">

        <h2>Create a new trip</h2>

        <form id="trip-form">

          <div class="input-group">
            <label for="trip-name">
              Trip name
            </label>
            <input type="text" id="trip-name" placeholder="Summer in Italy" required>
          </div>

          <div class="input-group">
            <label for="trip-origin">
              Origin
            </label>
            <input type="text" id="trip-origin" placeholder="Example: Barcelona" required>
          </div>

          <div class="input-group">

            <label for="trip-destination">
              Destination
            </label>

            <input type="text" id="trip-destination" placeholder="Example: Rome" required>

          </div>

          <div class="dates-row">
            <div class="input-group">
              <label for="trip-start">
                Start date
              </label>
              <input type="date" id="trip-start" required>
            </div>
            <div class="input-group">
              <label for="trip-end">
                End date
              </label>
              <input type="date" id="trip-end" required>
            </div>
          </div>
          <button type="submit" class="trip-save-btn">
            Save Trip
          </button>
        </form>
      </div>

      <div class="trips-container">
        <h2>My Trips</h2>
        <div id="trip-list"></div>
      </div>

    </section>

  </main>

</body>

</html>
